# Der Installer erstellt /etc/kienzle-sumup/kienzle-sumup.toml.
# Strings in Anführungszeichen, Ganzzahlen, boolesche Werte und String-Arrays.
[app]
base_url = "https://praxisserver:7868"
port = 7868
state_dir = "/var/lib/kienzle-sumup"
timezone = "Europe/Berlin"
session_hours = 8
max_amount_cents = 100000
development = false
launcher_key = "INSTALLER_GENERIERT_DIESEN_WERT"
encryption_key = "INSTALLER_GENERIERT_DIESEN_WERT"

[sumup]
mode = "mock"
api_key = ""
affiliate_key = ""
app_id = "de.kienzle.sumup"
merchant_code = ""
reader_id = ""

[fhir]
mode = "mock"
# Vom PHP-Server erreichbare Adresse. Der Launcher darf KEIN beliebiges Ziel bestimmen.
base_url = "https://t2med-server:16567/aps/fhir/api/r4"
# Exakte Basis-URLs, die t2med beim Start übergeben darf.
launch_urls = ["https://t2med-server:16567/aps/fhir/api/r4"]
api_key = ""
entry_code = "ZAHLUNG"
# Optional: vertrauenswürdiges Zertifikat / CA der t2med-Installation.
# Hinweis: Bei pin_certificate=true muss ca_file das öffentliche Serverzertifikat
# enthalten, das direkt vom t2med-Server bezogen wurde (nicht CA-Bundle).
ca_file = ""
pin_certificate = false

[mail]
enabled = false
host = ""
port = 587
encryption = "starttls"
username = ""
password = ""
from_address = ""
from_name = ""

# Optionaler RAW-Direktdruck auf Epson TM-m10 (58 mm), Samba-Gastzugriff.
[printing]
enabled = false
# tm-m10 (58 mm, 420 Punkte) oder tm-m30iii (80 mm, 576 Punkte)
model = "tm-m10"
# samba: Freigabe auf dem Druckserver; cups: RAW-Warteschlange (z. B. TM-m30III per LAN)
transport = "samba"
share = "//kienzlebox/TMm10"
cups_server = ""
queue = "TMm10"
width_dots = 420
cut = true
# Bei „Bar bezahlt“ (T2med-Rechnung) sofort eine Quittung drucken
cash_receipt_auto = false

# Optional: T2med-Rechnungen über den virtuellen Drucker „SumUp-Rechnung“ übernehmen.
# Der Druckserver sendet die PDF mit diesem Schlüssel an /invoice-inbox.php.
[invoice_inbox]
enabled = false
key = ""
# Nicht kassierte Rechnungen werden nach dieser Anzahl Tage nicht mehr angeboten.
max_age_days = 14

# Optional: Original-PDF der T2med-Rechnung in einen Netzwerkordner (SMB) kopieren,
# z. B. für die Steuerberatung. Dateiname: 2026-03-15_RE2026-0042_42,50EUR_Karte.pdf
[invoice_export]
enabled = false
share = "//nas/steuerberater"
# Unterordner in der Freigabe; {jahr} und {monat} stammen aus dem Rechnungsdatum.
directory = "Rechnungen/{jahr}/{monat}"
# Leer: Gastzugriff ohne Passwort.
username = ""
password = ""
domain = ""
# T2med-Rechnungen: paid = nur per Karte bezahlte, received = jede auf SumUp-Rechnung gedruckte.
when = "paid"
# Auch die in dieser App erzeugten Rechnungen/Leistungsbelege nach erfolgreicher Zahlung ablegen.
app_invoices = false

# Optional: normaler Praxisdrucker (A4) über CUPS, z. B. Laserdrucker am Empfang.
# T2med-Rechnungen werden immer hier gedruckt; App-Rechnungen wahlweise hier oder auf dem Bondrucker.
# cups_server leer = CUPS auf diesem Server, sonst z. B. "kienzlebox:631".
[office_printing]
enabled = false
cups_server = ""
queue = "Praxisdrucker"
media = "A4"
duplex = false

# Lokaler Leistungsbeleg / GOÄ-Rechnung mit Zahlungsbestätigung.
# Name und Anschrift ausfüllen; Bestandszahlungen behalten ihren bisherigen Beleg.
[practice]
name = ""
street = ""
city = ""
contact = ""
# Statt lokaler Zahlungsbestätigung: Vielen Dank. + SumUp-Originalbeleg.
# Kein Schnitt dazwischen; printing.cut gilt nur am Ende des gesamten Bons.
append_sumup_receipt = false
